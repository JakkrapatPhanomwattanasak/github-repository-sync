[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "api-automation"
version = "0.1.0"
description = "Runnable portfolio project with documented examples and tests"
requires-python = ">=3.11"
authors = [{name = "JakkrapatPhanomwattanasak", email = "Jakkrapat.phanom@gmail.com"}]
readme = "README.md"
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
api-sync = "api_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
